<div class="task-page">

  <div class="task-header">
    <h2>My tasks</h2>
    <button (click)="openCreateForm()">New task</button>
  </div>

  <div *ngIf="errorMessageN" class="error">{{ errorMessageN }}</div>
  <div *ngIf="loading">Loading tasks...</div>

  <div *ngIf="!loading && tasks.length === 0" class="empty">
    No tasks yet. Create your first one.
  </div>

  <div class="task-list">
    <div *ngFor="let task of tasks()" class="task-card">
      <div class="task-info">
        <h3>{{ task.title }}</h3>
        <p>{{ task.description }}</p>
        <div class="task-meta">
          <span class="badge">{{ task.status }}</span>
          <span class="badge">{{ task.priority }}</span>
          <span *ngIf="task.dueDate">Due: {{ task.dueDate }}</span>
        </div>
      </div>
      <button (click)="openEditForm(task)">Edit</button>
    </div>
  </div>

  <!-- Inline form -->
  <div *ngIf="showForm" class="task-form-overlay">
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
      <h3>{{ editingTask ? 'Edit task' : 'New task' }}</h3>

      <label>Title</label>
      <input type="text" formControlName="title" />

      <label>Description</label>
      <textarea formControlName="description"></textarea>

      <label>Status</label>
      <select formControlName="status">
        <option value="TODO">To do</option>
        <option value="IN_PROGRESS">In progress</option>
        <option value="DONE">Done</option>
      </select>

      <label>Priority</label>
      <select formControlName="priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>

      <label>Due date</label>
      <input type="date" formControlName="dueDate" />

      <label>Assignee username</label>
      <input type="text" formControlName="assigneeUsername" />

      <div class="form-actions">
        <button type="submit" [disabled]="taskForm.invalid">Save</button>
        <button type="button" (click)="cancelForm()">Cancel</button>
      </div>
    </form>
  </div>

</div>
