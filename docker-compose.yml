services:

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: devpass123
      MYSQL_DATABASE: auth_service_db
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevpass123"]
      interval: 5s
      timeout: 5s
      retries: 10

  task-db:
    image: mysql:8.0
    container_name: task-db
    environment:
      MYSQL_ROOT_PASSWORD: devpass123
      MYSQL_DATABASE: task_service_db
    ports:
      - "3308:3306"
    volumes:
      - task-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevpass123"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DB_HOST: auth-db
    ports:
      - "8081:8081"

  task-service:
    build: ./task-service
    container_name: task-service
    depends_on:
      task-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DB_HOST: task-db
    ports:
      - "8082:8082"

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - auth-service
      - task-service
    ports:
      - "4200:80"

volumes:
  auth-db-data:
  task-db-data: